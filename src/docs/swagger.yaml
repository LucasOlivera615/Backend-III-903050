      tags: [Stores]
      summary: Actualizar una tienda
      description: >-
        Enviar solo los campos que se quieren modificar. No vuelve a validar la existencia ni el rol
        de owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdateInput"
            example:
              address: Av. Siempre Viva 200
      responses:
        "200":
          description: Tienda actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
              example:
                status: success
                message: Tienda actualizada
                payload:
                  _id: 6acf7ff968b188fed334690b
                  name: Tienda Centro
                  address: Av. Siempre Viva 200
                  owner: 6acf7ff968b188fed334690a
                  isActive: true
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: VALIDATION_ERROR
        "404":
          description: Tienda no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Tienda no encontrada
                code: STORE_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    delete:
      tags: [Stores]
      summary: Eliminar una tienda
      description: Devuelve la tienda eliminada. No elimina automáticamente los pedidos asociados.
      responses:
        "200":
          description: Tienda eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
              example:
                status: success
                message: Tienda eliminada
                payload:
                  _id: 6acf7ff968b188fed334690b
                  name: Tienda Centro
                  address: Av. Siempre Viva 100
                  owner: 6acf7ff968b188fed334690a
                  isActive: true
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: VALIDATION_ERROR
        "404":
          description: Tienda no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Tienda no encontrada
                code: STORE_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
