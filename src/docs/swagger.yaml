tags:
  - name: Orders
    description: Gestión de pedidos
  - name: Users
    description: Gestión de usuarios
  - name: Stores
    description: Gestión de tiendas
  - name: Mocks
    description: Generación de datos ficticios en memoria o MongoDB
paths:
  /api/orders:
    get:
      tags: [Orders]
      summary: Listar pedidos
      description: Devuelve los pedidos con su cliente y tienda pobladas.
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersResponse"
              example:
                status: success
                message: Lista de pedidos
                payload:
                  - _id: 6acf7ff968b188fed334690d
                    customer:
                      _id: 6acf7ff968b188fed334690c
                      firstName: Ana
                      lastName: Gomez
                      email: ana@example.com
                      password: clave-de-prueba
                      role: customer
                      documents: []
                    store:
                      _id: 6acf7ff968b188fed334690b
                      name: Tienda Centro
                      address: Av. Siempre Viva 100
                      owner: 6acf7ff968b188fed334690a
                      isActive: true
                    items:
                      - name: Caja mediana
                        quantity: 2
                        price: 1500
                    deliveryAddress: Calle falsa 123
                    total: 3000
                    status: created
                    priority: normal
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    post:
      tags: [Orders]
      summary: Crear un pedido
      description: >-
        Requiere un cliente con rol customer y una tienda existentes. El servidor calcula total y
        fija status en created. Los IDs de ejemplo deben reemplazarse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
            example:
              customer: 6acf7ff968b188fed334690c
              store: 6acf7ff968b188fed334690b
              deliveryAddress: Calle falsa 123
              items:
                - name: Caja mediana
                  quantity: 2
                  price: 1500
              priority: normal
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                status: success
                message: Pedido creado
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer: 6acf7ff968b188fed334690c
                  store: 6acf7ff968b188fed334690b
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: created
                  priority: normal
        "400":
          description: >-
            Datos o ID inválidos, items vacíos, cantidad o precio inválido, o rol de cliente
            incorrecto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Faltan datos obligatorios
                code: VALIDATION_ERROR
        "404":
          description: Cliente o tienda no encontrados. También puede devolver STORE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: Error interno o validación de Mongoose no normalizada, como una prioridad desconocida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/orders/{oid}:
    parameters:
      - in: path
        name: oid
        required: true
        description: ID de un pedido existente. Reemplazar por un ID de tu base.
        schema:
          type: string
        example: 6acf7ff968b188fed334690d
    get:
      tags: [Orders]
      summary: Obtener un pedido por ID
      responses:
        "200":
          description: Pedido obtenido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReadResponse"
              example:
                status: success
                message: Pedido obtenido
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer:
                    _id: 6acf7ff968b188fed334690c
                    firstName: Ana
                    lastName: Gomez
                    email: ana@example.com
                    password: clave-de-prueba
                    role: customer
                    documents: []
                  store:
                    _id: 6acf7ff968b188fed334690b
                    name: Tienda Centro
                    address: Av. Siempre Viva 100
                    owner: 6acf7ff968b188fed334690a
                    isActive: true
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: created
                  priority: normal
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: VALIDATION_ERROR
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Pedido no encontrado
                code: ORDER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    delete:
      tags: [Orders]
      summary: Eliminar un pedido
      description: Elimina el pedido y devuelve el documento eliminado, con sus relaciones como IDs.
      responses:
        "200":
          description: Pedido eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                status: success
                message: Pedido eliminado
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer: 6acf7ff968b188fed334690c
                  store: 6acf7ff968b188fed334690b
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: created
                  priority: normal
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: VALIDATION_ERROR
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Pedido no encontrado
                code: ORDER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/orders/{oid}/status:
    parameters:
      - in: path
        name: oid
        required: true
        description: ID del pedido a actualizar.
        schema:
          type: string
        example: 6acf7ff968b188fed334690d
    put:
      tags: [Orders]
      summary: Actualizar el estado del pedido
      description: Valida que el estado exista. El proyecto no impone una secuencia de transiciones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
            example:
              status: assigned
      responses:
        "200":
          description: Estado del pedido actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                status: success
                message: Estado del pedido actualizado
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer: 6acf7ff968b188fed334690c
                  store: 6acf7ff968b188fed334690b
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: assigned
                  priority: normal
        "400":
          description: Estado inválido o ID con formato incorrecto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Estado de pedido invalido
                code: INVALID_ORDER_STATUS
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Pedido no encontrado
                code: ORDER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/users:
    get:
      tags: [Users]
      summary: Listar usuarios
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
              example:
                status: success
                message: Lista de usuarios
                payload:
                  - _id: 6acf7ff968b188fed334690c
                    firstName: Ana
                    lastName: Gomez
                    email: ana@example.com
                    password: clave-de-prueba
                    role: customer
                    documents: []
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    post:
      tags: [Users]
      summary: Crear un usuario
      description: >-
        role es opcional y su valor predeterminado es customer. Usar un email nuevo para cada
        creación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
            example:
              firstName: Ana
              lastName: Gomez
              email: ana@example.com
              password: clave-de-prueba
              role: customer
      responses:
        "201":
          description: usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: usuario creado
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana
                  lastName: Gomez
                  email: ana@example.com
                  password: clave-de-prueba
                  role: customer
                  documents: []
        "400":
          description: Faltan campos obligatorios o el rol no es válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Faltan datos obligatorios
                code: VALIDATION_ERROR
        "500":
          description: >-
            Error interno. Actualmente los emails duplicados y algunas validaciones de Mongoose
            también responden 500.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/users/{uid}:
    parameters:
      - in: path
        name: uid
        required: true
        description: ID del usuario.
        schema:
          type: string
        example: 6acf7ff968b188fed334690c
    get:
      tags: [Users]
      summary: Obtener un usuario por ID
      responses:
        "200":
          description: usuario obtenido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: usuario obtenido
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana
                  lastName: Gomez
                  email: ana@example.com
                  password: clave-de-prueba
                  role: customer
                  documents: []
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: VALIDATION_ERROR
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    put:
      tags: [Users]
      summary: Actualizar un usuario
      description: >-
        Enviar los campos que se quieren modificar. Un rol inválido se rechaza actualmente por
        Mongoose con 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
            example:
              firstName: Ana Maria
      responses:
        "200":
          description: usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: usuario actualizado
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana Maria
                  lastName: Gomez
                  email: ana@example.com
                  password: clave-de-prueba
                  role: customer
                  documents: []
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: VALIDATION_ERROR
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    delete:
      tags: [Users]
      summary: Eliminar un usuario
      description: Devuelve el usuario eliminado. No elimina automáticamente sus pedidos o tiendas.
      responses:
        "200":
          description: usuario eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: usuario eliminado
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana
                  lastName: Gomez
                  email: ana@example.com
                  password: clave-de-prueba
                  role: customer
                  documents: []
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: VALIDATION_ERROR
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/users/{uid}/documents:
    post:
      tags: [Users]
      summary: Subir un documento PDF de usuario
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          example: 6acf7ff968b188fed334690c
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document, type]
              properties:
                document:
                  type: string
                  format: binary
                  description: PDF de hasta 5 MB.
                type:
                  type: string
                  enum: [user_document]
                  example: user_document
      responses:
        "201":
          description: Documento agregado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Archivo, campo, tipo de documento o ID invalidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: El archivo supera el limite de 5 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error de almacenamiento o persistencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
  /api/stores:
    get:
      tags: [Stores]
      summary: Listar tiendas
      responses:
        "200":
          description: Lista de tiendas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoresResponse"
              example:
                status: success
                message: Lista de tiendas
                payload:
                  - _id: 6acf7ff968b188fed334690b
                    name: Tienda Centro
                    address: Av. Siempre Viva 100
                    owner: 6acf7ff968b188fed334690a
                    isActive: true
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    post:
      tags: [Stores]
      summary: Crear una tienda
      description: owner debe ser el ID de un usuario existente cuyo rol sea store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
            example:
              name: Tienda Centro
              address: Av. Siempre Viva 100
              owner: 6acf7ff968b188fed334690a
      responses:
        "201":
          description: Tienda creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
              example:
                status: success
                message: Tienda creada
                payload:
                  _id: 6acf7ff968b188fed334690b
                  name: Tienda Centro
                  address: Av. Siempre Viva 100
                  owner: 6acf7ff968b188fed334690a
                  isActive: true
        "400":
          description: Faltan datos, el ID es inválido o el propietario no tiene rol store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: El propietario debe tener rol store
                code: INVALID_USER_ROLE
        "404":
          description: Usuario propietario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario propietario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/stores/{sid}:
    parameters:
      - in: path
        name: sid
        required: true
        description: ID de la tienda; no confundir con el ID de su propietario.
        schema:
          type: string
        example: 6acf7ff968b188fed334690b
    get:
      tags: [Stores]
      summary: Obtener una tienda por ID
      responses:
        "200":
          description: Tienda obtenida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
              example:
                status: success
                message: Tienda obtenida
                payload:
                  _id: 6acf7ff968b188fed334690b
                  name: Tienda Centro
                  address: Av. Siempre Viva 100
                  owner: 6acf7ff968b188fed334690a
                  isActive: true
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: VALIDATION_ERROR
        "404":
          description: Tienda no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Tienda no encontrada
                code: STORE_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
