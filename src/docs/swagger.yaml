                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: usuario obtenido
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana
                  lastName: Gomez
                  email: ana@example.com
                  role: customer
                  documents: []
                  createdAt: "2026-11-25T12:00:00.000Z"
                  updatedAt: "2026-11-25T12:00:00.000Z"
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: VALIDATION_ERROR
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    put:
      tags: [Users]
      summary: Actualizar un usuario
      description: >-
        Enviar los campos que se quieren modificar. Un rol inválido se rechaza actualmente por
        Mongoose con 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
            example:
              firstName: Ana Maria
      responses:
        "200":
          description: usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: usuario actualizado
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana Maria
                  lastName: Gomez
                  email: ana@example.com
                  role: customer
                  documents: []
                  createdAt: "2026-11-25T12:00:00.000Z"
                  updatedAt: "2026-11-25T13:00:00.000Z"
        "400":
          description: >-
            El ID no tiene el formato correcto, el cuerpo de la solicitud no es un objeto, los campos de actualizacion no son validos o la contraseña no cumple los requisitos.
            No se permiten objetos vacios, campos desconocidos ni operadores de MongoDB.
            Si se proporciona una contraseña, debe ser un texto no vacio de hasta 72 bytes en UTF-8.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidId:
                  summary: ID invalido
                  value:
                    status: error
                    message: ID invalido
                    code: VALIDATION_ERROR
                invalidBody:
                  summary: Cuerpo de solicitud invalido
                  value:
                    status: error
                    message: Los datos de actualizacion deben ser un objeto
                    code: VALIDATION_ERROR
                invalidFields:
                  summary: Campos de actualizacion invalidos
                  value:
                    status: error
                    message: Campos de actualizacion invalidos
                    code: VALIDATION_ERROR
                invalidPassword:
                  summary: Contraseña invalida
                  value:
                    status: error
                    message: La contraseña debe ser un texto no vacio de hasta 72 bytes
                    code: VALIDATION_ERROR
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    delete:
      tags: [Users]
      summary: Eliminar un usuario
      description: Devuelve el usuario eliminado. No elimina automáticamente sus pedidos o tiendas.
      responses:
        "200":
          description: usuario eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: usuario eliminado
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana Maria
                  lastName: Gomez
