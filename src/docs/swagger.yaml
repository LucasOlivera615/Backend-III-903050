  /api/mocks/mockingorders:
    get:
      tags: [Mocks]
      summary: Generar pedidos sin guardarlos
      description: >-
        Genera pedidos y relaciones ficticias en memoria. Los IDs relacionados no se guardan en
        MongoDB y no deben usarse como relaciones de un POST real.
      parameters:
        - in: query
          name: qty
          required: false
          description: Cantidad a generar en memoria. Si no se envía, se generan 10.
          schema:
            type: integer
            minimum: 0
            maximum: 400
            default: 10
          example: 3
      responses:
        "200":
          description: Pedidos mock generados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockOrdersResponse"
              example:
                status: success
                message: Pedidos mock generados
                payload:
                  - _id: 6acf7ff968b188fed3346921
                    customer: 6acf7ff968b188fed3346911
                    store: 6acf7ff968b188fed334690b
                    items:
                      - name: Paquete 1
                        quantity: 1
                        price: 1500
                    deliveryAddress: Av. Siempre Viva 101
                    total: 1500
                    status: created
                    priority: normal
                  - _id: 6acf7ff968b188fed3346922
                    customer: 6acf7ff968b188fed3346912
                    store: 6acf7ff968b188fed334690b
                    items:
                      - name: Paquete 2
                        quantity: 1
                        price: 1500
                    deliveryAddress: Av. Siempre Viva 102
                    total: 1500
                    status: created
                    priority: normal
                  - _id: 6acf7ff968b188fed3346923
                    customer: 6acf7ff968b188fed3346913
                    store: 6acf7ff968b188fed334690b
                    items:
                      - name: Paquete 3
                        quantity: 1
                        price: 1500
                    deliveryAddress: Av. Siempre Viva 103
                    total: 1500
                    status: created
                    priority: normal
        "400":
          description: Cantidad fuera del rango 0 a 400 o no entera.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: qty debe ser un entero entre 0 y 400
                code: INVALID_MOCK_AMOUNT
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/mocks/generateData:
    post:
      tags: [Mocks]
      summary: Guardar datos ficticios en MongoDB
      description: >-
        Body opcional. Por defecto: users=10, stores=5 y orders=10. Cada cantidad debe estar entre 0
        y 400. Si orders es mayor que cero, users y stores también deben ser mayores que cero en
        esta carga. Se crea un propietario por tienda; el contador users suma clientes y
        propietarios. Los IDs son nuevos en cada ejecución.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockDataInput"
            example:
              users: 2
              stores: 1
              orders: 2
      responses:
        "201":
          description: Datos mock generados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockDataResponse"
              example:
                status: success
                message: Datos mock generados
                payload:
                  users: 3
                  stores: 1
                  orders: 2
        "400":
          description: Cantidad inválida o se solicitan pedidos sin clientes o tiendas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Para generar pedidos se necesita al menos un customer y un store
                code: INVALID_MOCK_AMOUNT
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
components:
  schemas:
    OrderItem:
      type: object
      required: [name, quantity, price]
      properties:
        name:
          type: string
          example: Caja mediana
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Cantidad mayor que cero.
          example: 2
        price:
          type: number
          minimum: 0
          description: Precio por unidad. Puede ser cero.
          example: 1500
    User:
      type: object
      required: [_id, firstName, lastName, email, role]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690c
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          example: clave-de-prueba
        role:
          type: string
          enum: [admin, customer, store]
          example: customer
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
    UserInput:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          example: clave-de-prueba
        role:
          type: string
          enum: [admin, customer, store]
          default: customer
          example: customer
    Store:
      type: object
      required: [_id, name, address, owner]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690b
        name:
          type: string
          example: Tienda Centro
        address:
          type: string
          example: Av. Siempre Viva 100
        owner:
          type: string
          description: ID del usuario propietario; no es el ID de la tienda.
          example: 6acf7ff968b188fed334690a
        isActive:
          type: boolean
          example: true
    StoreInput:
      type: object
      required: [name, address, owner]
      properties:
        name:
          type: string
          example: Tienda Centro
        address:
          type: string
          example: Av. Siempre Viva 100
        owner:
          type: string
          description: ID de un usuario existente con rol store.
          example: 6acf7ff968b188fed334690a
    OrderInput:
      type: object
      required: [customer, store, items, deliveryAddress]
      properties:
        customer:
          type: string
          description: ID de un usuario existente con rol customer. Reemplazar por un ID de tu base.
          example: 6acf7ff968b188fed334690c
        store:
          type: string
          description: ID de una tienda existente. Reemplazar por un ID de tu base.
          example: 6acf7ff968b188fed334690b
        deliveryAddress:
          type: string
          example: Calle falsa 123
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
          minItems: 1
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
          example: normal
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
          example: assigned
    MockDataInput:
      type: object
      properties:
        users:
          type: integer
          minimum: 0
          maximum: 400
          default: 10
          example: 2
          description: Cantidad de clientes.
        stores:
          type: integer
          minimum: 0
          maximum: 400
          default: 5
          example: 1
          description: Cantidad de tiendas. Se crea un propietario por tienda.
        orders:
          type: integer
          minimum: 0
          maximum: 400
          default: 10
          example: 2
          description: Para crear pedidos, users y stores deben ser mayores que cero.
    MockDataResult:
      type: object
      required: [users, stores, orders]
      properties:
        users:
          type: integer
          example: 3
          description: Total de clientes y propietarios creados.
        stores:
          type: integer
          example: 1
        orders:
          type: integer
          example: 2
    ErrorResponse:
      type: object
      required: [status, message, code]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Pedido no encontrado
        code:
          type: string
          example: ORDER_NOT_FOUND
    InternalErrorResponse:
      type: object
      required: [status, message, code]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Error interno en el servidor
        code:
          description: Puede ser un texto o un código numérico de MongoDB, según el error original.
          example: INTERNAL_SERVER_ERROR
    UserUpdateInput:
      type: object
      properties:
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          example: clave-de-prueba
        role:
          type: string
          enum: [admin, customer, store]
          example: customer
      description: Enviar solo los campos que se quieren actualizar. No se exigen todos los campos de creación.
    StoreUpdateInput:
      type: object
      properties:
        name:
          type: string
          example: Tienda Centro
        address:
          type: string
          example: Av. Siempre Viva 100
        owner:
          type: string
          description: ID de un usuario existente con rol store.
          example: 6acf7ff968b188fed334690a
        isActive:
          type: boolean
          example: true
      description: >-
        Enviar solo los campos a actualizar. La actualización actual no vuelve a comprobar el rol
        del propietario.
    Customer:
      type: object
      required: [_id, firstName, lastName, email, role]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690c
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          example: clave-de-prueba
        role:
          type: string
          enum: [admin, customer, store]
          example: customer
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
      nullable: true
      description: Usuario poblado por las consultas de pedidos. Puede ser null si el usuario fue eliminado.
    StoreRead:
      type: object
      required: [_id, name, address, owner]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690b
        name:
          type: string
          example: Tienda Centro
        address:
          type: string
          example: Av. Siempre Viva 100
        owner:
          type: string
          description: ID del usuario propietario; no es el ID de la tienda.
          example: 6acf7ff968b188fed334690a
        isActive:
          type: boolean
          example: true
      nullable: true
      description: Tienda poblada por las consultas de pedidos. Puede ser null si la tienda fue eliminada.
    Order:
      type: object
      required: [_id, customer, store, items, deliveryAddress, total, status, priority]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690d
        customer:
          type: string
          example: 6acf7ff968b188fed334690c
        store:
          type: string
          example: 6acf7ff968b188fed334690b
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          type: string
          example: Calle falsa 123
        total:
          type: number
          description: Calculado por el servidor.
          example: 3000
        status:
          type: string
          enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
          example: created
        priority:
          type: string
          enum: [low, normal, high]
          example: normal
    OrderRead:
      type: object
      required: [_id, customer, store, items, deliveryAddress, total, status, priority]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690d
        customer:
          $ref: "#/components/schemas/Customer"
        store:
          $ref: "#/components/schemas/StoreRead"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          type: string
          example: Calle falsa 123
        total:
          type: number
          description: Calculado por el servidor.
          example: 3000
        status:
          type: string
          enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
          example: created
        priority:
          type: string
          enum: [low, normal, high]
          example: normal
      description: Pedido consultado con cliente y tienda pobladas.
    OrdersResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Lista de pedidos
        payload:
          type: array
          items:
            $ref: "#/components/schemas/OrderRead"
    OrderResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Pedido creado
        payload:
          $ref: "#/components/schemas/Order"
    OrderReadResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Pedido obtenido
        payload:
          $ref: "#/components/schemas/OrderRead"
    UsersResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Lista de usuarios
        payload:
          type: array
          items:
            $ref: "#/components/schemas/User"
    UserResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: usuario creado
        payload:
          $ref: "#/components/schemas/User"
    StoresResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Lista de tiendas
        payload:
          type: array
          items:
            $ref: "#/components/schemas/Store"
    StoreResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Tienda creada
        payload:
          $ref: "#/components/schemas/Store"
    MockUsersResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Usuarios mock generados
        payload:
          type: array
          items:
            $ref: "#/components/schemas/User"
    MockOrdersResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Pedidos mock generados
        payload:
          type: array
          items:
            $ref: "#/components/schemas/Order"
    MockDataResponse:
      type: object
      required: [status, message, payload]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Datos mock generados
        payload:
          $ref: "#/components/schemas/MockDataResult"
    Document:
      type: object
      required: [originalName, fileName, path, mimeType, size, type, uploadedAt]
      properties:
        originalName:
          type: string
          example: dni.pdf
        fileName:
          type: string
          example: 767ec782-e213-4894-a2d3-b0de753f5cbb.pdf
        path:
          type: string
          example: uploads/documents/767ec782-e213-4894-a2d3-b0de753f5cbb.pdf
        mimeType:
          type: string
          example: application/pdf
        size:
          type: integer
          example: 24533
        type:
          type: string
          enum: [user_document]
          example: user_document
        uploadedAt:
          type: string
          format: date-time
          example: "2026-11-02T15:00:00.000Z"
