  /api/mocks/generateData:
    post:
      tags: [Mocks]
      summary: Guardar datos ficticios en MongoDB
      description: >-
        Body opcional. Por defecto: users=10, stores=5 y orders=10. Cada cantidad debe estar entre 0
        y 400. Si orders es mayor que cero, users y stores también deben ser mayores que cero en
        esta carga. Se crea un propietario por tienda; el contador users suma clientes y
        propietarios. Los IDs son nuevos en cada ejecución.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockDataInput"
            example:
              users: 2
              stores: 1
              orders: 2
      responses:
        "201":
          description: Datos mock generados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockDataResponse"
              example:
                status: success
                message: Datos mock generados
                payload:
                  users: 3
                  stores: 1
                  orders: 2
        "400":
          description: Cantidad inválida o se solicitan pedidos sin clientes o tiendas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Para generar pedidos se necesita al menos un customer y un store
                code: INVALID_MOCK_AMOUNT
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
components:
  schemas:
    OrderItem:
      type: object
      required: [name, quantity, price]
      properties:
        name:
          type: string
          example: Caja mediana
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Cantidad mayor que cero.
          example: 2
        price:
          type: number
          minimum: 0
          description: Precio por unidad. Puede ser cero.
          example: 1500
    User:
      type: object
      required: [_id, firstName, lastName, email, role]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690c
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          example: ana@example.com
        role:
          type: string
          enum: [admin, customer, store]
          example: customer
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-11-25T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-11-25T12:00:00.000Z"
    UserInput:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Contraseña no vacía de hasta 72 bytes en UTF-8. Se almacena hasheada mediante bcrypt y nunca se devuelve en las respuestas de la API.
          example: clave-de-prueba
        role:
          type: string
          enum: [admin, customer, store]
          default: customer
          example: customer
    Store:
      type: object
      required: [_id, name, address, owner]
      properties:
        _id:
          type: string
          example: 6acf7ff968b188fed334690b
        name:
          type: string
          example: Tienda Centro
        address:
          type: string
          example: Av. Siempre Viva 100
        owner:
          type: string
          description: ID del usuario propietario; no es el ID de la tienda.
          example: 6acf7ff968b188fed334690a
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-11-25T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-11-25T12:00:00.000Z"
    StoreInput:
      type: object
      required: [name, address, owner]
      properties:
        name:
          type: string
          example: Tienda Centro
        address:
          type: string
          example: Av. Siempre Viva 100
        owner:
          type: string
          description: ID de un usuario existente con rol store.
          example: 6acf7ff968b188fed334690a
    OrderInput:
      type: object
      required: [customer, store, items, deliveryAddress]
      properties:
        customer:
          type: string
          description: ID de un usuario existente con rol customer. Reemplazar por un ID de tu base.
          example: 6acf7ff968b188fed334690c
        store:
          type: string
          description: ID de una tienda existente. Reemplazar por un ID de tu base.
          example: 6acf7ff968b188fed334690b
        deliveryAddress:
          type: string
          example: Calle falsa 123
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
          minItems: 1
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
          example: normal
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
          example: assigned
    MockDataInput:
      type: object
      properties:
        users:
          type: integer
          minimum: 0
          maximum: 400
          default: 10
          example: 2
          description: Cantidad de clientes.
        stores:
          type: integer
          minimum: 0
          maximum: 400
          default: 5
          example: 1
          description: Cantidad de tiendas. Se crea un propietario por tienda.
        orders:
          type: integer
          minimum: 0
          maximum: 400
          default: 10
          example: 2
          description: Para crear pedidos, users y stores deben ser mayores que cero.
    MockDataResult:
      type: object
      description: Cantidades de documentos mock insertados en MongoDB.
      required:
        - users
        - stores
        - orders
      properties:
        users:
          type: integer
          minimum: 0
          maximum: 800
          example: 3
          description: Total de clientes y propietarios de tiendas creados.
        stores:
          type: integer
          minimum: 0
          maximum: 400
          example: 1
          description: Total de tiendas creadas.
        orders:
          type: integer
          minimum: 0
          maximum: 400
          example: 2
          description: Total de pedidos creados.
    ErrorResponse:
      type: object
      required: [status, message, code]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Pedido no encontrado
        code:
          type: string
          example: ORDER_NOT_FOUND
    InternalErrorResponse:
      type: object
      required: [status, message, code]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Error interno en el servidor
        code:
          description: Puede ser un texto o un código numérico de MongoDB, según el error original.
          example: INTERNAL_SERVER_ERROR
    UserUpdateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Gomez
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Nueva contraseña no vacía de hasta 72 bytes en UTF-8. Si se proporciona, se genera un nuevo hash mediante bcrypt. Si se omite, se conserva la contraseña existente.
          example: nueva-clave-de-prueba
        role:
          type: string
          enum: [admin, customer, store]
          example: customer
      description: Enviar solo los campos que se quieren actualizar. No se exigen todos los campos de creación.
    StoreUpdateInput:
      type: object
      properties:
        name:
          type: string
          example: Tienda Centro
        address:
          type: string
          example: Av. Siempre Viva 100
        owner:
          type: string
          description: ID de un usuario existente con rol store.
          example: 6acf7ff968b188fed334690a
        isActive:
          type: boolean
          example: true
