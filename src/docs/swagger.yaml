tags:
  - name: Orders
    description: Gestión de pedidos
  - name: Users
    description: Gestión de usuarios
  - name: Stores
    description: Gestión de tiendas
  - name: Mocks
    description: Generación de datos ficticios en memoria o MongoDB
paths:
  /api/orders:
    get:
      tags: [Orders]
      summary: Listar pedidos
      description: >-
        Devuelve los pedidos con su cliente y tienda pobladas.
        Permite paginar los resultados y filtrarlos por estado y prioridad.
        Los filtros pueden combinarse.
      parameters:
        - in: query
          name: page
          required: false
          description: Numero de pagina solicitada.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - in: query
          name: limit
          required: false
          description: Cantidad maxima de pedidos por pagina.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 5
        - in: query
          name: status
          required: false
          description: Filtrar pedidos por estado.
          schema:
            type: string
            enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
          example: created
        - in: query
          name: priority
          required: false
          description: Filtrar pedidos por prioridad.
          schema:
            type: string
            enum: [low, normal, high]
          example: high
      responses:
        "200":
          description: Lista paginada de pedidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersResponse"
              example:
                status: success
                message: Lista de pedidos
                payload:
                  docs:
                    - _id: 6acf7ff968b188fed334690d
                      customer:
                        _id: 6acf7ff968b188fed334690c
                        firstName: Ana
                        lastName: Gomez
                        email: ana@example.com
                        role: customer
                      store:
                          _id: 6acf7ff968b188fed334690b
                          name: Tienda Centro
                          address: Av. Siempre Viva 100
                          owner: 6acf7ff968b188fed334690a
                          isActive: true
                          createdAt: "2026-11-25T12:00:00.000Z"
                          updatedAt: "2026-11-25T12:00:00.000Z"
                      items:
                        - name: Caja mediana
                          quantity: 2
                          price: 1500
                      deliveryAddress: Calle falsa 123
                      total: 3000
                      status: created
                      priority: normal
                      proof: null
                      createdAt: "2026-11-25T12:30:00.000Z"
                      updatedAt: "2026-11-25T12:30:00.000Z"
                  totalDocs: 1
                  page: 1
                  limit: 5
                  totalPages: 1
                  hasNextPage: false
                  hasPrevPage: false
        "400":
          description: >-
            Parametros de paginacion, estado o prioridad invalidos.
            Puede devolver INVALID_PAGINATION, INVALID_ORDER_STATUS
            o INVALID_ORDER_PRIORITY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidPagination:
                  summary: Paginacion invalida
                  value:
                    status: error
                    message: Los parametros page y limit deben ser enteros positivos. El limite maximo es 100
                    code: INVALID_PAGINATION
                invalidStatus:
                  summary: Estado invalido
                  value:
                    status: error
                    message: Estado de pedido invalido
                    code: INVALID_ORDER_STATUS
                invalidPriority:
                  summary: Prioridad invalida
                  value:
                    status: error
                    message: Prioridad de pedido invalida
                    code: INVALID_ORDER_PRIORITY
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    post:
      tags: [Orders]
      summary: Crear un pedido
      description: >-
        Requiere un cliente con rol customer y una tienda existentes. El servidor calcula total y
        fija status en created. Los IDs de ejemplo deben reemplazarse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
            example:
              customer: 6acf7ff968b188fed334690c
              store: 6acf7ff968b188fed334690b
              deliveryAddress: Calle falsa 123
              items:
                - name: Caja mediana
                  quantity: 2
                  price: 1500
              priority: normal
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                status: success
                message: Pedido creado
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer: 6acf7ff968b188fed334690c
                  store: 6acf7ff968b188fed334690b
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: created
                  priority: normal
                  proof: null
                  createdAt: "2026-11-25T12:30:00.000Z"
                  updatedAt: "2026-11-25T12:30:00.000Z"
        "400":
          description: >-
            Datos o ID inválidos, items vacíos, cantidad o precio inválido, o rol de cliente
            incorrecto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Faltan datos obligatorios
                code: VALIDATION_ERROR
        "404":
          description: Cliente o tienda no encontrados. También puede devolver STORE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Usuario no encontrado
                code: USER_NOT_FOUND
        "500":
          description: Error interno o validación de Mongoose no normalizada, como una prioridad desconocida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/orders/{oid}:
    parameters:
      - in: path
        name: oid
        required: true
        description: ID de un pedido existente. Reemplazar por un ID de tu base.
        schema:
          type: string
        example: 6acf7ff968b188fed334690d
    get:
      tags: [Orders]
      summary: Obtener un pedido por ID
      responses:
        "200":
          description: Pedido obtenido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReadResponse"
              example:
                status: success
                message: Pedido obtenido
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer:
                    _id: 6acf7ff968b188fed334690c
                    firstName: Ana
                    lastName: Gomez
                    email: ana@example.com
                    role: customer
                  store:
                    _id: 6acf7ff968b188fed334690b
                    name: Tienda Centro
                    address: Av. Siempre Viva 100
                    owner: 6acf7ff968b188fed334690a
                    isActive: true
                    createdAt: "2026-11-25T12:00:00.000Z"
                    updatedAt: "2026-11-25T12:00:00.000Z"
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: created
                  priority: normal
                  proof: null
                  createdAt: "2026-11-25T12:30:00.000Z"
                  updatedAt: "2026-11-25T12:30:00.000Z"
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: VALIDATION_ERROR
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Pedido no encontrado
                code: ORDER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    delete:
      tags: [Orders]
      summary: Eliminar un pedido
      description: Elimina el pedido y devuelve el documento eliminado, con sus relaciones como IDs.
      responses:
        "200":
          description: Pedido eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                status: success
                message: Pedido eliminado
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer: 6acf7ff968b188fed334690c
                  store: 6acf7ff968b188fed334690b
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: assigned
                  priority: normal
                  proof: null
                  createdAt: "2026-11-25T12:30:00.000Z"
                  updatedAt: "2026-11-25T12:45:00.000Z"
        "400":
          description: El ID no tiene el formato correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: ID invalido
                code: VALIDATION_ERROR
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Pedido no encontrado
                code: ORDER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/orders/{oid}/proof:
    post:
      tags: [Orders]
      summary: Subir un comprobante PDF de pedido
      description: >-
        Permite adjuntar un único comprobante PDF a un pedido existente.
        El archivo debe pesar como máximo 5 MB. Si el pedido ya tiene
        un comprobante, se rechaza la nueva carga.
        El archivo se guarda en disco y sus metadatos en MongoDB.
      parameters:
        - in: path
          name: oid
          required: true
          description: ID del pedido al que se adjunta el comprobante.
          schema:
            type: string
          example: 6acf7ff968b188fed334690d
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proof]
              properties:
                proof:
                  type: string
                  format: binary
                  description: Archivo PDF de hasta 5 MB.
      responses:
        "201":
          description: Comprobante agregado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                status: success
                message: Comprobante agregado correctamente
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer: 6acf7ff968b188fed334690c
                  store: 6acf7ff968b188fed334690b
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: assigned
                  priority: normal
                  proof:
                    originalName: comprobante.pdf
                    fileName: 767ec782-e213-4894-a2d3-b0de753f5cbb.pdf
                    path: uploads/proofs/767ec782-e213-4894-a2d3-b0de753f5cbb.pdf
                    mimeType: application/pdf
                    size: 24533
                    type: order_proof
                    uploadedAt: "2026-11-25T13:00:00.000Z"
                  createdAt: "2026-11-25T12:30:00.000Z"
                  updatedAt: "2026-11-25T13:00:00.000Z"
        "400":
          description: >-
            Archivo faltante, formato inválido, campo incorrecto,
            ID inválido o pedido que ya tiene un comprobante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: El pedido ya tiene un comprobante
                code: INVALID_UPLOAD
        "404":
          description: Pedido no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Pedido no encontrado
                code: ORDER_NOT_FOUND
        "413":
          description: El archivo supera el límite de 5 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: El archivo supera el limite maximo de 5MB
                code: FILE_TOO_LARGE
        "500":
          description: Error de almacenamiento o persistencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
  /api/orders/{oid}/status:
    parameters:
      - in: path
        name: oid
        required: true
        description: ID del pedido a actualizar.
        schema:
          type: string
        example: 6acf7ff968b188fed334690d
    put:
      tags: [Orders]
      summary: Actualizar el estado del pedido
      description: Valida que el estado exista. El proyecto no impone una secuencia de transiciones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
            example:
              status: assigned
      responses:
        "200":
          description: Estado del pedido actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                status: success
                message: Estado del pedido actualizado
                payload:
                  _id: 6acf7ff968b188fed334690d
                  customer: 6acf7ff968b188fed334690c
                  store: 6acf7ff968b188fed334690b
                  items:
                    - name: Caja mediana
                      quantity: 2
                      price: 1500
                  deliveryAddress: Calle falsa 123
                  total: 3000
                  status: assigned
                  priority: normal
                  proof: null
                  createdAt: "2026-11-25T12:30:00.000Z"
                  updatedAt: "2026-11-25T12:45:00.000Z"
        "400":
          description: Estado inválido o ID con formato incorrecto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Estado de pedido invalido
                code: INVALID_ORDER_STATUS
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Pedido no encontrado
                code: ORDER_NOT_FOUND
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/users:
    get:
      tags: [Users]
      summary: Listar usuarios
      description: >-
        Devuelve una lista paginada de usuarios.
        Permite seleccionar la pagina y la cantidad de resultados.
      parameters:
        - in: query
          name: page
          required: false
          description: Numero de pagina solicitada.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - in: query
          name: limit
          required: false
          description: Cantidad maxima de usuarios por pagina.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 5
      responses:
        "200":
          description: Lista paginada de usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
              example:
                status: success
                message: Lista de usuarios
                payload:
                  docs:
                      - _id: 6acf7ff968b188fed334690c
                        firstName: Ana
                        lastName: Gomez
                        email: ana@example.com
                        role: customer
                        documents: []
                        createdAt: "2026-11-25T12:00:00.000Z"
                        updatedAt: "2026-11-25T12:00:00.000Z"
                  totalDocs: 1
                  page: 1
                  limit: 5
                  totalPages: 1
                  hasNextPage: false
                  hasPrevPage: false
        "400":
          description: Parametros de paginacion invalidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Los parametros page y limit deben ser enteros positivos. El limite maximo es 100
                code: INVALID_PAGINATION
        "500":
          description: >-
            Error interno del servidor o de persistencia. El mensaje y el código dependen de la
            causa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
    post:
      tags: [Users]
      summary: Crear un usuario
      description: >-
        role es opcional y su valor predeterminado es customer. Usar un email nuevo para cada
        creación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
            example:
              firstName: Ana
              lastName: Gomez
              email: ana@example.com
              password: clave-de-prueba
              role: customer
      responses:
        "201":
          description: usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                status: success
                message: usuario creado
                payload:
                  _id: 6acf7ff968b188fed334690c
                  firstName: Ana
                  lastName: Gomez
                  email: ana@example.com
                  role: customer
                  documents: []
                  createdAt: "2026-11-25T12:00:00.000Z"
                  updatedAt: "2026-11-25T12:00:00.000Z"
        "400":
          description: >-
            Faltan campos obligatorios, el cuerpo de la solicitud no es un objeto, la contraseña no es válida o el rol no está permitido.
            La contraseña debe ser un texto no vacío de hasta 72 bytes en UTF-8.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingRequiredFields:
                  summary: Faltan campos obligatorios o la contraseña no es válida
                  value:
                    status: error
                    message: Faltan datos obligatorios
                    code: VALIDATION_ERROR
                invalidBody:
                  summary: Cuerpo de solicitud inválido
                  value:
                    status: error
                    message: Los datos del usuario deben ser un objeto
                    code: VALIDATION_ERROR
                passwordTooLong:
                  summary: Contraseña superior a 72 bytes
                  value:
                    status: error
                    message: La contraseña no puede superar los 72 bytes
                    code: VALIDATION_ERROR
                invalidRole:
                  summary: Rol inválido
                  value:
                    status: error
                    message: Rol invalido
                    code: INVALID_USER_ROLE
        "500":
          description: >-
            Error interno. Actualmente los emails duplicados y algunas validaciones de Mongoose
            también responden 500.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
              example:
                status: error
                message: Error interno en el servidor
                code: INTERNAL_SERVER_ERROR
  /api/users/{uid}:
    parameters:
      - in: path
        name: uid
        required: true
        description: ID del usuario.
        schema:
          type: string
        example: 6acf7ff968b188fed334690c
    get:
      tags: [Users]
